name: Issue Labeler

on:
  issues:
    types: [opened]


permissions: {}

jobs:
  label:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: pip install huggingface_hub
      - name: Get labels from LLM
        id: get-labels
        env:
          HF_TOKEN: ${{ secrets.ISSUE_LABELER_HF_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          RAW=$(python utils/label_issues.py) || RAW=""
          # Treat LLM output as untrusted: must be a JSON list of simple label strings; emit single-line JSON
          LABELS=$(printf '%s' "$RAW" | python -c "import json,sys,re
try:
    d=json.loads(sys.stdin.read())
except Exception:
    d=[]
if not isinstance(d,list):
    d=[]
out=[l for l in d if isinstance(l,str) and re.fullmatch(r'[A-Za-z0-9 _.:/-]{1,50}',l)][:5]
print(json.dumps(out) if out else '')") || LABELS=""
          LABELS=$(printf '%s' "$LABELS" | tr -d '\r\n')
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
      - name: Apply labels
        if: steps.get-labels.outputs.labels != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ steps.get-labels.outputs.labels }}
        run: |
          # Only apply labels that already exist in the repository (allowlist)
          ALLOWED=$(gh label list --limit 500 --json name -q '.[].name')
          printf '%s' "$LABELS" | python -c "import json,sys; print('\n'.join(l for l in json.load(sys.stdin) if isinstance(l,str)))" | while IFS= read -r label; do
            if [ -n "$label" ] && printf '%s\n' "$ALLOWED" | grep -Fxq -- "$label"; then
              gh issue edit "$ISSUE_NUMBER" --add-label "$label"
            else
              echo "Skipping label not in allowlist"
            fi
          done
