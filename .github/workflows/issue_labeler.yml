name: Issue Labeler

on:
  issues:
    types: [opened]


permissions: {}

jobs:
  label:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: pip install huggingface_hub
      - name: Get labels from LLM
        id: get-labels
        env:
          HF_TOKEN: ${{ secrets.ISSUE_LABELER_HF_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ALLOWED_LABELS: ${{ vars.ISSUE_LABELER_ALLOWED_LABELS }}
        run: |
          LABELS=$(python utils/label_issues.py)
          SAFE_LABELS=$(printf '%s' "$LABELS" | python -c "
          import json, os, sys
          allowed = {l.strip() for l in os.environ.get('ALLOWED_LABELS', '').split(',') if l.strip()}
          try:
              data = json.loads(sys.stdin.read())
          except Exception:
              data = []
          if not isinstance(data, list):
              data = []
          out = sorted({l for l in data if isinstance(l, str) and l in allowed})
          print(json.dumps(out, separators=(',', ':')))
          ")
          if [ -n "$SAFE_LABELS" ] && [ "$SAFE_LABELS" != "[]" ]; then
            echo "labels=$SAFE_LABELS" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply labels
        if: steps.get-labels.outputs.labels != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: ${{ steps.get-labels.outputs.labels }}
        run: |
          for label in $(echo "$LABELS" | python -c "import json,sys; print('\n'.join(json.load(sys.stdin)))"); do
            gh issue edit "$ISSUE_NUMBER" --add-label "$label"
          done
