name: Update Diffusers metadata

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - update_diffusers_metadata*


permissions: {}

jobs:
  update_metadata:
    permissions:
      contents: read
      id-token: write  # needed for the HF Trusted Publisher token exchange
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Setup environment
        run: |
          pip install --upgrade pip
          pip install datasets pandas "huggingface_hub>=1.19.0"
          pip install .[torch]

      - name: Update metadata
        env:
          # Short-lived token (1h) from the Hub's Trusted Publishers, scoped to this dataset only
          HF_OIDC_RESOURCE: datasets/huggingface/diffusers-metadata
        run: |
          python utils/update_metadata.py --commit_sha ${{ github.sha }}
