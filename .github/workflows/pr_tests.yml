name: Fast tests for PRs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "src/diffusers/**.py"
      - "tests/**.py"
      - "utils/**.py"
      - "setup.py"
      - ".github/workflows/pr_tests.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run the fetcher against (e.g. 13664). Leave empty to run against the branch this workflow was dispatched from."
        type: string
        default: ""
      force_full_suite:
        description: "Run the full test suite instead of fetcher selection"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DIFFUSERS_IS_CI: yes
  HF_XET_HIGH_PERFORMANCE: 1
  OMP_NUM_THREADS: 4
  MKL_NUM_THREADS: 4
  PYTEST_TIMEOUT: 60
  # Force version overrides across every `uv pip install` in this workflow via UV_OVERRIDE:
  #   - torch/torchvision/torchaudio pinned to the image's baked-in set so `-U` installs
  #     (e.g. accelerate@main) can't bump torch and break torchvision's C++ ABI
  #     (torchvision::nms). The pinned set is (re)written into the override file per job below.
  UV_OVERRIDE: /tmp/uv-overrides.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check_code_quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[quality]
      - name: Check quality
        run: make quality
      - name: Check if failure
        if: ${{ failure() }}
        run: |
          echo "Quality check failed. Please ensure the right dependency versions are installed with 'pip install -e .[quality]' and run 'make style && make quality'" >> $GITHUB_STEP_SUMMARY

  check_repository_consistency:
    needs: check_code_quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[quality]
      - name: Check repo consistency
        run: |
          python utils/check_copies.py
          python utils/check_dummies.py
          python utils/check_support_list.py
          python utils/check_forward_call_docstrings.py
          make deps_table_check_updated
      - name: Check if failure
        if: ${{ failure() }}
        run: |
          echo "Repo consistency check failed. Please ensure the right dependency versions are installed with 'pip install -e .[quality]' and run 'make fix-copies'" >> $GITHUB_STEP_SUMMARY

  setup_tests:
    name: Setup Tests
    needs: [check_code_quality, check_repository_consistency]
    runs-on:
      group: aws-general-8-plus
    container:
      image: diffusers/diffusers-pytorch-cpu
      options: --shm-size "16gb" --ipc host -v /mnt/hf_cache:/mnt/cache/
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
    - name: Show dispatch inputs
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        if [ -n "${{ inputs.pr_number }}" ]; then
          echo "Running fetcher against PR #${{ inputs.pr_number }} (https://github.com/${{ github.repository }}/pull/${{ inputs.pr_number }})"
        else
          echo "Running fetcher against dispatch ref: ${{ github.ref }}"
        fi
        echo "force_full_suite=${{ inputs.force_full_suite }}"
    - name: Checkout diffusers
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
        fetch-depth: 0
    - name: Fetch refs/remotes/origin/main
      # `actions/checkout` only fetches the ref it checks out. The fetcher diffs HEAD against
      # `origin/main`, so explicitly fetch main and download its objects regardless of dispatch ref.
      run: |
        git -c safe.directory="$GITHUB_WORKSPACE" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
    - name: Overlay fetcher script from dispatch branch
      # TODO(DN6): remove once this fetcher is on `main`. Dispatching with `pr_number` checks out the
      # PR's head ref (`refs/pull/N/merge` only exists while a PR is open), which carries the PR's (old)
      # `utils/tests_fetcher.py`. Overlay the dispatch branch's copy so the run exercises the fetcher
      # under validation, not the PR's stale one.
      if: ${{ inputs.pr_number != '' }}
      env:
        DISPATCH_REF: ${{ github.ref }}
      run: |
        git -c safe.directory="$GITHUB_WORKSPACE" fetch --depth=1 origin "$DISPATCH_REF"
        git -c safe.directory="$GITHUB_WORKSPACE" checkout FETCH_HEAD -- utils/tests_fetcher.py
        git -c safe.directory="$GITHUB_WORKSPACE" diff --stat HEAD -- utils/tests_fetcher.py || true
    - name: Install dependencies
      run: |
        printf 'torch==2.10.0\ntorchvision==0.25.0\ntorchaudio==2.10.0\n' > "$UV_OVERRIDE"
        uv pip install -e ".[quality]"
    - name: Environment
      run: |
        diffusers-cli env
        echo $(git --version)
    - name: Fetch Tests
      env:
        # Trigger full suite when:
        #   - the PR has the `run-all-tests` label, or
        #   - the workflow was dispatched with force_full_suite=true.
        FORCE_FULL_SUITE: ${{ contains(github.event.pull_request.labels.*.name, 'run-all-tests') || (github.event_name == 'workflow_dispatch' && inputs.force_full_suite) }}
        # Trust the workspace for every git subprocess spawned by gitpython. Without this,
        # `git cat-file --batch-check` aborts on the container-runner ownership mismatch and
        # writes nothing to stdout, which surfaces as "SHA could not be resolved" in the fetcher.
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: "safe.directory"
        GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      run: |
        if [ "$FORCE_FULL_SUITE" = "true" ]; then
          python utils/tests_fetcher.py --force_full_suite
        else
          python utils/tests_fetcher.py
        fi
        echo "--- test_map.json ---"
        if [ -f test_map.json ]; then
          cat test_map.json
        else
          echo "(no test_map.json produced)"
        fi
    - id: set_matrix
      name: Create Test Matrix
      run: |
        if [ -f test_map.json ]; then
            matrix=$(python3 -c 'import json; print(json.dumps(json.load(open("test_map.json"))))')
        else
            matrix='[]'
        fi

        echo "matrix=$matrix" >> $GITHUB_OUTPUT
        echo "Matrix: $matrix"

  run_tests_cpu:
    name: ${{ matrix.name }}
    needs: setup_tests
    if: needs.setup_tests.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.setup_tests.outputs.matrix) }}
    runs-on:
      group: aws-general-8-plus
    container:
      image: diffusers/diffusers-pytorch-cpu
      options: --shm-size "16gb" --ipc host -v /mnt/hf_cache:/mnt/cache/
    defaults:
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.DIFFUSERS_HF_HUB_READ_TOKEN }}
    steps:
    - name: Checkout diffusers
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
        fetch-depth: 2

    - name: Install Dependencies
      run: |
        printf 'torch==2.10.0\ntorchvision==0.25.0\ntorchaudio==2.10.0\n' > "$UV_OVERRIDE"
        uv pip install -e ".[quality]"
        uv pip uninstall transformers huggingface_hub && UV_PRERELEASE=allow uv pip install -U transformers@git+https://github.com/huggingface/transformers.git
        uv pip uninstall accelerate && uv pip install -U accelerate@git+https://github.com/huggingface/accelerate.git --no-deps
        uv pip install -U peft@git+https://github.com/huggingface/peft.git --no-deps

    - name: Environment
      run: |
        diffusers-cli env

    - name: Run selected tests on CPU
      # A feature-split job (e.g. `models-lora`) can legitimately match zero tests in the selected files;
      # pytest reports that as exit code 5. Surface it as a notice instead of a failure.
      run: |
        set +e
        pytest -n 4 --max-worker-restart=0 --dist=loadfile \
          -k "not Onnx" \
          -m "${{ matrix.markers }}" \
          --make-reports=${{ matrix.name }}_tests_cpu \
          ${{ matrix.paths }}
        status=$?
        set -e
        if [ "$status" -eq 5 ]; then
          echo "::notice title=${{ matrix.name }}::No tests matched -m \"${{ matrix.markers }}\" in the selected files. Nothing ran."
          exit 0
        fi
        exit $status

    - name: Test summary
      if: ${{ always() }}
      run: |
        {
          echo "### ${{ matrix.name }}"
          echo '```'
          cat reports/${{ matrix.name }}_tests_cpu_stats.txt 2>/dev/null || echo "no tests collected for -m \"${{ matrix.markers }}\""
          echo '```'
        } >> $GITHUB_STEP_SUMMARY

    - name: Failure short reports
      if: ${{ failure() }}
      continue-on-error: true
      run: |
        cat reports/${{ matrix.name }}_tests_cpu_stats.txt
        cat reports/${{ matrix.name }}_tests_cpu_failures_short.txt

    - name: Test suite reports artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{ matrix.name }}_cpu_test_reports
        path: reports
