name: Fast tests for PRs - Test Fetcher

on: workflow_dispatch

permissions:
  contents: read

env:
  DIFFUSERS_IS_CI: yes
  OMP_NUM_THREADS: 4
  MKL_NUM_THREADS: 4
  PYTEST_TIMEOUT: 60

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup_pr_tests:
    name: Setup PR Tests
    runs-on:
      group: aws-general-8-plus
    container:
      image: diffusers/diffusers-pytorch-cpu
      options: --shm-size "16gb" --ipc host -v /mnt/hf_cache:/mnt/cache/
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
    - name: Checkout diffusers
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        uv pip install -e ".[quality]"
    - name: Environment
      run: |
        diffusers-cli env
        echo $(git --version)
    - name: Fetch Tests
      # The checkout step only marks the workspace safe in a temporary git config, so git processes the
      # fetcher spawns in the container would otherwise refuse the repo as dubiously owned.
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        python utils/tests_fetcher.py | tee test_preparation.txt
    - name: Report selection in job summary
      run: |
        if [ -f test_fetcher_summary.md ]; then
            cat test_fetcher_summary.md >> $GITHUB_STEP_SUMMARY
        fi
    - name: Report fetched tests
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: test_fetched
        path: test_preparation.txt
    - id: set_matrix
      name: Create Test Matrix
      # `test_map.json` is a list of matrix entries `{"name", "paths", "markers"}`, one job each.
      # If no test to run (so no `test_map.json` file), emit an empty list and skip the test job.
      run: |
        if [ -f test_map.json ]; then
            matrix=$(python3 -c 'import json; print(json.dumps(json.load(open("test_map.json"))))')
        else
            matrix='[]'
        fi
        echo "matrix=$matrix" >> $GITHUB_OUTPUT
        echo "Matrix: $matrix"

  run_pr_tests:
    name: ${{ matrix.name }}
    needs: setup_pr_tests
    if: needs.setup_pr_tests.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.setup_pr_tests.outputs.matrix) }}
    runs-on:
      group: aws-general-8-plus
    container:
      image: diffusers/diffusers-pytorch-cpu
      options: --shm-size "16gb" --ipc host -v /mnt/hf_cache:/mnt/cache/
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout diffusers
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 2

    - name: Install dependencies
      run: |
        uv pip install -e ".[quality]"
        uv pip install accelerate

    - name: Environment
      run: |
        diffusers-cli env

    - name: Run all selected tests on CPU
      run: |
        pytest -n 2 --dist=loadfile -m "${{ matrix.markers }}" --make-reports=${{ matrix.name }}_tests_cpu ${{ matrix.paths }}

    - name: Failure short reports
      if: ${{ failure() }}
      continue-on-error: true
      run: |
        cat reports/${{ matrix.name }}_tests_cpu_stats.txt
        cat reports/${{ matrix.name }}_tests_cpu_failures_short.txt

    - name: Test suite reports artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
          name: ${{ matrix.name }}_test_reports
          path: reports

  run_staging_tests:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Hub tests for models, schedulers, and pipelines
            framework: hub_tests_pytorch
            runner: aws-general-8-plus
            image: diffusers/diffusers-pytorch-cpu
            report: torch_hub

    name: ${{ matrix.config.name }}
    runs-on:
      group: ${{ matrix.config.runner }}
    container:
      image: ${{ matrix.config.image }}
      options: --shm-size "16gb" --ipc host -v /mnt/hf_cache:/mnt/cache/

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout diffusers
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 2

    - name: Install dependencies
      run: |
        pip install -e [quality]

    - name: Environment
      run: |
        diffusers-cli env

    - name: Run Hub tests for models, schedulers, and pipelines on a staging env
      if: ${{ matrix.config.framework == 'hub_tests_pytorch' }}
      run: |
        HUGGINGFACE_CO_STAGING=true pytest \
          -m "is_staging_test" \
          --make-reports=tests_${{ matrix.config.report }} \
          tests

    - name: Failure short reports
      if: ${{ failure() }}
      run: cat reports/tests_${{ matrix.config.report }}_failures_short.txt

    - name: Test suite reports artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: pr_${{ matrix.config.report }}_test_reports
        path: reports
